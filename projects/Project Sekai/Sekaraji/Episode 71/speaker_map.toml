# Speaker map for Sekaraji Episode 71 (Ichika / Nene)
#
# Hosts differ from Episode 72 — Sekaraji rotates its pair every episode. Taken
# from the video description's 出演者 list (野口瑠璃子 / Machico, listed 順不同).
#
# VA→character pairings verified against profiles/proseka/leoneed.toml and
# profiles/proseka/wxs.toml in this repo, not from recall.
#
# Character colours from sekai-story-indexer meta.json
# (webapp/static/meta.json), the documented ProSeka source in
# autosub's docs/speaker_colors.md. Look up the CHARACTER, never the VA.
#
# Only labels 0 and 1 are mapped so far. Chirp 3 diarizes each 18-minute chunk
# independently and over-segments, so this episode will surface more raw labels
# than there are hosts. Run `autosub assign-speakers` after the first pass and add
# the extra labels here, all pointing at slot 1 or slot 2.
#
# Avatar paths are relative to THIS FILE, so the map works whatever directory the
# pipeline runs from. Neither photo exists yet — the cards render as blank tinted
# panels until they are added.

[speakers."0"]
name = "Ruriko Noguchi"
character = "Ichika Hoshino"
color = "#33AAEE"
slot = 1
avatar = "../../official_cast_photos/ruriko_noguchi.webp"

[speakers."1"]
name = "Machico"
character = "Nene Kusanagi"
color = "#33DD99"
slot = 2
avatar = "../../official_cast_photos/machico.webp"
